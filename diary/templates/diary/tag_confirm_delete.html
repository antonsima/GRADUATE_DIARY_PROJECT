{% block title %}Удаление тега - Дневник{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Удаление тега</h2>
            </div>
            <div class="card-body">
                <p>Вы уверены, что хотите удалить тег <strong>"{{ object.name }}"</strong>?</p>
                <p>Это действие нельзя отменить. Записи, связанные с этим тегом, не будут удалены, но тег будет убран из них.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'diary:tag_list' %}" class="btn btn-secondary">Отмена</a>
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
