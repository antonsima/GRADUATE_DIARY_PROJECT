{% extends 'diary/base.html' %}
{% load diary_extras %}
{% block title %}Статистика - Мой Дневник{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Статистика записей</h1>
    <div>
        <a href="{% url 'diary:entry_calendar' %}" class="btn btn-primary me-2">Календарь</a>
        <a href="{% url 'diary:entry_create' %}" class="btn btn-success">Новая запись</a>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Распределение по настроению</h5>
            </div>
            <div class="card-body">
                <canvas id="moodChart" width="400" height="300"></canvas>
            </div>
        </div>
    </div>
    
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Популярные теги</h5>
            </div>
            <div class="card-body">
                <canvas id="tagChart" width="400" height="300"></canvas>
            </div>
        </div>
    </div>
    
    <div class="col-12 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Активность по месяцам ({{ current_year }})</h5>
            </div>
            <div class="card-body">
                <canvas id="monthlyChart" width="400" height="150"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Подключаем Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // График распределения по настроению
    const moodCtx = document.getElementById('moodChart').getContext('2d');
    const moodChart = new Chart(moodCtx, {
        type: 'pie',
        data: {
            labels: [
                {% for stat in mood_stats %}
                    '{{ stat.mood|get_mood_display }}',
                {% endfor %}
            ],
            datasets: [{
                data: [
                    {% for stat in mood_stats %}
                        {{ stat.count }},
                    {% endfor %}
                ],
                backgroundColor: [
                    '#ca1d23', // Очень плохое - красный
                    '#e7949e', // Плохое - розовый
                    '#72757a', // Нейтральное - серый
                    '#a8927c', // Хорошее - бежевый
                    '#6aa958'  // Отличное - зеленый
                ]
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'right',
                }
            }
        }
    });

    // График популярных тегов (топ-10)
    const tagCtx = document.getElementById('tagChart').getContext('2d');
    const tagChart = new Chart(tagCtx, {
        type: 'bar',
        data: {
            labels: [
                {% for stat in tag_stats|slice:":10" %}
                    '{{ stat.name }}',
                {% endfor %}
            ],
            datasets: [{
                label: 'Количество записей',
                data: [
                    {% for stat in tag_stats|slice:":10" %}
                        {{ stat.count }},
                    {% endfor %}
                ],
                backgroundColor: [
                    {% for stat in tag_stats|slice:":10" %}
                        '{{ stat.color }}',
                    {% endfor %}
                ]
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            }
        }
    });

    // График активности по месяцам
    const monthlyCtx = document.getElementById('monthlyChart').getContext('2d');

    // Создаем массив данных для всех месяцев
    const monthlyData = Array(12).fill(0);
    {% for stat in monthly_stats %}
        monthlyData[{{ stat.month|add:"-1" }}] = {{ stat.count }};
    {% endfor %}

    const monthNames = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];

    const monthlyChart = new Chart(monthlyCtx, {
        type: 'line',
        data: {
            labels: monthNames,
            datasets: [{
                label: 'Количество записей',
                data: monthlyData,
                fill: false,
                borderColor: '#8b7866',
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            }
        }
    });
</script>
{% endblock %}
