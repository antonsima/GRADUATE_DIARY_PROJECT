<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация</title>
    <!-- Bootstrap CSS -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-navbar {
            background-color: #e4d6c9 !important;
            border-bottom: 2px solid #d6c8bb !important;
            padding: 0.5rem 1rem;
        }

        .custom-navbar .navbar-brand {
            color: #5a4a42 !important;
            font-weight: 600;
            font-size: 1.3rem;
        }

        .custom-navbar .nav-link {
            color: #5a4a42 !important;
            margin: 0 0.5rem;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .custom-navbar .nav-link:hover,
        .custom-navbar .nav-link.active {
            background-color: #d6c8bb !important;
            color: #3a2e28 !important;
        }

        .custom-navbar .navbar-toggler {
            border: 1px solid #d6c8bb;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light d-flex flex-wrap justify-content-between align-items-center py-3 my-3 border rounded-3 custom-navbar">
        <div class="container-fluid col-md-4 d-flex align-items-center ps-4">
            <a class="navbar-brand mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1" href="#">
                📓 Мой Дневник
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Записи</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Календарь</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Настройки</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Bootstrap JS -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
