{% extends "users/base.html" %}
{% load static %}

{% block content %}
<div class="section">
    <h2>2. Авторизация</h2>
    <form id="login-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" name="email" required>
        </div>
        <div class="form-group">
            <label for="login-password">Пароль:</label>
            <input type="password" id="login-password" name="password" required>
        </div>
        <button type="submit">Войти</button>
    </form>
    <div id="login-response" class="response"></div>
</div>

<script src="{% static 'js/api_for_users.js' %}"></script>
<script>
    // Проверяем, если пользователь уже авторизован, перенаправляем на профиль
    if (isAuthenticated()) {
        window.location.href = '/users/profile/';
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = {
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value,
            csrfmiddlewaretoken: getCookie('csrftoken')
        };

        const response = await apiRequest('/users/api/login/', 'POST', formData, false);
        const responseDiv = document.getElementById('login-response');

        if (response.ok) {
            responseDiv.innerHTML = `<span class="success">Успешный вход! Перенаправление...</span>`;
            saveTokens(response.data.access, response.data.refresh);

            // Перенаправление на страницу профиля после успешного входа
            setTimeout(() => {
                window.location.href = '/users/profile/';
            }, 1000);
        } else {
            responseDiv.innerHTML = `<span class="error">Ошибка ${response.status}:</span>\n${JSON.stringify(response.data, null, 2)}`;
        }
    });
</script>
{% endblock %}
