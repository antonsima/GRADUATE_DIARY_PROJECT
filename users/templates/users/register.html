{% extends "users/base.html" %}
{% load static %}

{% block content %}
<div class="section">
    <h2>1. Регистрация пользователя</h2>
    <form id="register-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="first_name">Имя:</label>
            <input type="text" id="first_name" name="first_name">
        </div>
        <div class="form-group">
            <label for="last_name">Фамилия:</label>
            <input type="text" id="last_name" name="last_name">
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <div id="register-response" class="response"></div>
</div>

<script src="{% static 'js/api.js' %}"></script>
<script>
    document.getElementById('register-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            first_name: document.getElementById('first_name').value,
            last_name: document.getElementById('last_name').value,
            csrfmiddlewaretoken: getCookie('csrftoken')
        };

        const response = await apiRequest('/users/api/register/', 'POST', formData, false);
        const responseDiv = document.getElementById('register-response');

        if (response.ok) {
            responseDiv.innerHTML = `<span class="success">Успешно! Пользователь создан:</span>\n${JSON.stringify(response.data, null, 2)}`;

            // Автоматический вход после регистрации
            const loginData = {
                email: formData.email,
                password: formData.password,
                csrfmiddlewaretoken: getCookie('csrftoken')
            };

            const loginResponse = await apiRequest('/users/api/login/', 'POST', loginData, false);

            if (loginResponse.ok) {
                saveTokens(loginResponse.data.access, loginResponse.data.refresh);
                setTimeout(() => {
                    window.location.href = '/users/profile/';
                }, 2000);
            }
        } else {
            responseDiv.innerHTML = `<span class="error">Ошибка ${response.status}:</span>\n${JSON.stringify(response.data, null, 2)}`;
        }
    });
</script>
{% endblock %}
